name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SystemCodexMonitor.sln
      - run: dotnet build SystemCodexMonitor.sln -c Release -p:Platform=x64 --no-restore
      - run: dotnet run --project tests/SecurityChecks/SecurityChecks.csproj -c Release
      - shell: powershell
        run: ./scripts/Test-Security.ps1
